name: Main build
on: 
  push:
    branches:
      - 'main'

jobs:
  builds:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}   # checkout the correct branch name
          fetch-depth: 0                # fetch the whole repo history

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0
        with:
          useConfigFile: true 

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore 

      - name: Build mod file
        run: |
          Compress-Archive ./Zeepkist.Rumble/bin/Release/net472/package/* mod.zip

      - name: Upload to mod.io
        env:
          MODIO_TOKEN: ${{ secrets.MODIO_TOKEN }}
          GAME_ID: ${{ vars.GAME_ID }}
          MOD_ID: ${{ vars.MOD_ID }}
        run: |
          curl --fail-with-body "https://g-${GAME_ID}.modapi.io/v1/games/${GAME_ID}/mods/${MOD_ID}/files" \
            -H "Authorization: Bearer $MODIO_TOKEN" \
            -F "filedata=@mod.zip" \
            -F "version=${{ steps.version.outputs.version }}" \
            -F "changelog=<changelog.txt"